<style>
:root{
  --bg:#F2F5F2;--surface:#FFFFFF;--surface2:#E8EEE9;--fg:#13201A;--muted:#5F6E64;--line:#D5DDD7;--line2:#E6ECE7;
  --accent:#1C6B41;--accent-fg:#FFFFFF;--accent-soft:#DCEFE2;--accent-ink:#0F4A2B;
  --warn:#9A5B00;--warn-soft:#FBEBCF;--danger:#B3261E;--danger-soft:#F9DEDC;--info:#24579F;--info-soft:#DCE7F8;
  --shadow:0 1px 2px rgba(19,32,26,.05),0 6px 18px rgba(19,32,26,.06);
  --r:14px;--rs:9px;
  --hero1:#174A2E;--hero2:#1F7A4A;--hero-fg:#FFFFFF;--hero-muted:rgba(255,255,255,.72);--hero-bar:rgba(255,255,255,.22);
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0E1310;--surface:#161D18;--surface2:#1E2821;--fg:#E8EEE9;--muted:#98A79D;--line:#2A362E;--line2:#222D26;
  --accent:#5AC287;--accent-fg:#07160D;--accent-soft:#193A27;--accent-ink:#9FE2BB;
  --warn:#F0B55B;--warn-soft:#3A2A0F;--danger:#F28B82;--danger-soft:#45201D;--info:#8FB6F2;--info-soft:#1B2B47;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 6px 18px rgba(0,0,0,.25);
  --hero1:#102A1B;--hero2:#1B4A30;--hero-fg:#EAF6EE;--hero-muted:rgba(234,246,238,.7);--hero-bar:rgba(255,255,255,.14);color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0E1310;--surface:#161D18;--surface2:#1E2821;--fg:#E8EEE9;--muted:#98A79D;--line:#2A362E;--line2:#222D26;
  --accent:#5AC287;--accent-fg:#07160D;--accent-soft:#193A27;--accent-ink:#9FE2BB;
  --warn:#F0B55B;--warn-soft:#3A2A0F;--danger:#F28B82;--danger-soft:#45201D;--info:#8FB6F2;--info-soft:#1B2B47;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 6px 18px rgba(0,0,0,.25);
  --hero1:#102A1B;--hero2:#1B4A30;--hero-fg:#EAF6EE;--hero-muted:rgba(234,246,238,.7);--hero-bar:rgba(255,255,255,.14);color-scheme:dark}

*{box-sizing:border-box}
:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
img{max-width:100%}
[hidden]{display:none!important}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--fg);font:15px/1.45 Manrope,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;font-variant-numeric:tabular-nums;-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;border:0;background:none;padding:0}
a{color:var(--accent);text-decoration:none}
h1,h2,h3{margin:0;text-wrap:balance;line-height:1.2}
h1{font-size:22px;font-weight:800;letter-spacing:-.01em}
h2{font-size:17px;font-weight:700}
h3{font-size:13px;font-weight:700;text-transform:uppercase;letter-spacing:.06em;color:var(--muted)}
.muted{color:var(--muted)}
.small{font-size:12.5px}
.num{font-variant-numeric:tabular-nums}
.app{display:flex;min-height:100%}
.side{display:none;width:64px;flex:none;position:sticky;top:0;height:100vh;z-index:30}
.sidein{position:absolute;top:0;bottom:0;left:0;width:64px;background:var(--surface);border-right:1px solid var(--line);padding:18px 12px;overflow-x:hidden;overflow-y:auto;transition:width .16s ease,box-shadow .16s ease}
.side:hover .sidein,.side:has(:focus-visible) .sidein{width:220px;box-shadow:0 12px 32px rgba(0,0,0,.16);transition-delay:.12s}
body.navpin .side{width:220px}body.navpin .sidein{width:220px;box-shadow:none}
.sidein .brand{padding-left:5px;padding-right:0;white-space:nowrap}.sidein .btxt{min-width:0;overflow:hidden}.sidein .btxt b{display:block;overflow:hidden;text-overflow:ellipsis}.sidein .navbtn{position:relative;white-space:nowrap}
.sidein .navbtn span,.sidein .navgrp,.sidein .navhint,.sidein .btxt,.navpinb{transition:opacity .12s}
body:not(.navpin) .side:not(:hover):not(:has(:focus-visible)) :is(.navbtn span,.navgrp,.navhint,.btxt,.navpinb){opacity:0}
body:not(.navpin) .side:not(:hover):not(:has(:focus-visible)) .navdot{position:absolute;left:28px;top:3px;padding:0 5px}
.navpinb{margin-left:auto;width:30px;height:30px;border-radius:8px;display:grid;place-items:center;color:var(--muted);flex:none}
.navpinb svg{width:16px;height:16px}.navpinb:hover{background:var(--surface2)}body.navpin .navpinb{color:var(--accent-ink);background:var(--accent-soft)}
.brand{display:flex;align-items:center;gap:10px;padding:6px 10px 18px}
.brand .mark{width:30px;height:30px;border-radius:9px;background:var(--accent);color:var(--accent-fg);display:grid;place-items:center;font-weight:800;font-size:15px}
.brand b{font-size:16px;letter-spacing:.14em;font-weight:800}
.brand span{display:block;font-size:11px;color:var(--muted);letter-spacing:.02em;font-weight:500}
.navbtn{display:flex;align-items:center;gap:10px;width:100%;padding:10px 10px;border-radius:10px;font-weight:600;color:var(--muted)}
.navbtn svg{width:20px;height:20px;flex:none}
.navbtn.on{background:var(--accent-soft);color:var(--accent-ink)}
.navbtn:hover:not(.on){background:var(--surface2)}
.main{flex:1;min-width:0;display:flex;flex-direction:column}
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);padding:14px 16px 10px;display:flex;align-items:center;justify-content:space-between;gap:10px}
.view{padding-block:0 96px;padding-inline:16px;max-width:1080px;width:100%;margin:0 auto}
.top-in{max-width:1080px;width:100%;margin:0 auto;display:flex;align-items:center;justify-content:space-between;gap:10px}
.bnav{position:fixed;left:0;right:0;bottom:0;z-index:6;display:flex;background:var(--surface);border-top:1px solid var(--line);padding:6px 4px calc(6px + env(safe-area-inset-bottom,0px))}
.bnav button{flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;padding:4px 0;font-size:11px;font-weight:600;color:var(--muted);border-radius:10px}
.bnav button svg{width:22px;height:22px}
.bnav button.on{color:var(--accent-ink)}
.bnav button.on svg{color:var(--accent)}
@media(min-width:900px){.side{display:block}.bnav{display:none}.view{padding-bottom:40px}}

.card{background:var(--surface);border:1px solid var(--line2);border-radius:var(--r);box-shadow:var(--shadow);padding:14px 16px}
.grid{display:grid;gap:12px}
.g2{grid-template-columns:repeat(2,minmax(0,1fr))}
.g3{grid-template-columns:repeat(3,minmax(0,1fr))}
.g4{grid-template-columns:repeat(4,minmax(0,1fr))}
@media(max-width:640px){.g4{grid-template-columns:repeat(2,minmax(0,1fr))}.g3{grid-template-columns:repeat(2,minmax(0,1fr))}}
.stat .l{font-size:12px;color:var(--muted);font-weight:600}
.stat .v{font-size:24px;font-weight:800;letter-spacing:-.02em;margin-top:2px}
.stat .s{font-size:12px;color:var(--muted);margin-top:2px}
.stack{display:flex;flex-direction:column;gap:12px}
.row{display:flex;align-items:center;gap:10px}
.row.wrap{flex-wrap:wrap}
.sp{justify-content:space-between}
.grow{flex:1;min-width:0}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;padding:9px 14px;border-radius:10px;font-weight:700;font-size:14px;background:var(--surface2);color:var(--fg);border:1px solid transparent;white-space:nowrap}
.btn.p{background:var(--accent);color:var(--accent-fg)}
.btn.o{background:transparent;border-color:var(--line)}
.btn.d{background:var(--danger-soft);color:var(--danger)}
.btn.w{background:var(--warn-soft);color:var(--warn)}
.btn.sm{padding:6px 10px;font-size:13px;border-radius:8px}
.btn.xs{padding:4px 8px;font-size:12px;border-radius:7px}
.btn:disabled{opacity:.45;cursor:default}
.btn.block{width:100%}
.chips{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;padding-bottom:2px}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;padding:6px 12px;border-radius:999px;border:1px solid var(--line);font-size:13px;font-weight:600;color:var(--muted);background:var(--surface)}
.chip.on{background:var(--fg);color:var(--bg);border-color:var(--fg)}
.seg{display:inline-flex;background:var(--surface2);border-radius:10px;padding:3px;gap:2px}
.seg button{padding:6px 11px;border-radius:8px;font-size:13px;font-weight:700;color:var(--muted)}
.seg button.on{background:var(--surface);color:var(--fg);box-shadow:0 1px 2px rgba(0,0,0,.08)}
.input,select.input,textarea.input{width:100%;padding:10px 12px;border:1px solid var(--line);border-radius:10px;background:var(--surface);outline:none;min-width:0}
.input:focus{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
textarea.input{min-height:70px;resize:vertical}
label.f{display:block;font-size:12px;font-weight:700;color:var(--muted);margin-bottom:4px}
.field{min-width:0}
.badge{display:inline-flex;align-items:center;gap:4px;padding:2px 8px;border-radius:999px;font-size:11.5px;font-weight:700;white-space:nowrap}
.badge.g{background:var(--accent-soft);color:var(--accent-ink)}
.badge.y{background:var(--warn-soft);color:var(--warn)}
.badge.r{background:var(--danger-soft);color:var(--danger)}
.badge.b{background:var(--info-soft);color:var(--info)}
.badge.n{background:var(--surface2);color:var(--muted)}
.list{display:flex;flex-direction:column;background:var(--surface);border:1px solid var(--line2);border-radius:var(--r);box-shadow:var(--shadow);overflow:hidden}
.item{display:flex;align-items:center;gap:12px;padding:12px 14px;border-bottom:1px solid var(--line2);text-align:left;width:100%}
.item:last-child{border-bottom:0}
.item .t{font-weight:700}
.item .s{font-size:12.5px;color:var(--muted);margin-top:1px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.item .r{text-align:right;flex:none}
.item.click:hover{background:var(--surface2)}
.empty{padding:34px 16px;text-align:center;color:var(--muted)}
.empty b{display:block;color:var(--fg);font-size:16px;margin-bottom:4px}
.tbl{width:100%;border-collapse:collapse;font-size:13.5px}
.tbl th{font-size:11.5px;text-transform:uppercase;letter-spacing:.05em;color:var(--muted);text-align:left;padding:8px 10px;border-bottom:1px solid var(--line);font-weight:700;white-space:nowrap}
.tbl td{padding:9px 10px;border-bottom:1px solid var(--line2);vertical-align:middle}
.tbl tr:last-child td{border-bottom:0}
.tbl .n{text-align:right}
.tbl tr.click{cursor:pointer}
.tbl tr.click:hover td{background:var(--surface2)}
.scroll{overflow-x:auto}
.pbar{height:6px;border-radius:99px;background:var(--surface2);overflow:hidden}
.pbar i{display:block;height:100%;background:var(--accent);border-radius:99px;transition:width .3s}
.drow{display:flex;align-items:center;gap:10px;padding:10px 12px;border-bottom:1px solid var(--line2)}
.drow:last-child{border-bottom:0}
.drow.done{background:color-mix(in srgb,var(--accent-soft) 45%,var(--surface))}
.drow.skip{opacity:.6}
.drow .body{flex:1;min-width:0;text-align:left}
.drow .nm{font-weight:700;display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.drow .qt{font-size:13px;color:var(--muted);margin-top:1px}
.drow .qt b{color:var(--fg);font-weight:700}
.ck{width:40px;height:40px;border-radius:12px;border:1.5px solid var(--line);display:grid;place-items:center;flex:none;color:transparent;background:var(--surface)}
.ck.on{background:var(--accent);border-color:var(--accent);color:var(--accent-fg)}
.ck.skip{background:var(--warn-soft);border-color:transparent;color:var(--warn)}
.ck svg{width:20px;height:20px}
.areahd{padding:10px 12px 4px;font-size:11.5px;font-weight:800;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.step{display:flex;align-items:center;gap:0;border:1px solid var(--line);border-radius:10px;overflow:hidden}
.step button{width:40px;height:40px;font-size:20px;font-weight:600;background:var(--surface2)}
.step input{width:64px;text-align:center;border:0;height:40px;background:var(--surface);outline:none;font-weight:700}
.qgrid{display:grid;grid-template-columns:1fr auto;gap:10px 12px;align-items:center}
.sheet{position:fixed;inset:0;z-index:20;background:rgba(10,18,13,.45);display:flex;align-items:flex-end;justify-content:center}
.sheet .panel{background:var(--surface);width:100%;max-width:640px;max-height:92%;border-radius:18px 18px 0 0;display:flex;flex-direction:column;box-shadow:0 -10px 40px rgba(0,0,0,.2)}
@media(min-width:720px){.sheet{align-items:center;padding:20px}.sheet .panel{border-radius:18px;max-height:88%}}
.sheet .hd{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:14px 16px;border-bottom:1px solid var(--line2)}
.sheet .bd{overflow:auto;padding:16px;padding-bottom:calc(16px + env(safe-area-inset-bottom,0px))}
.x{width:34px;height:34px;border-radius:50%;background:var(--surface2);display:grid;place-items:center;font-size:18px}
#toast{position:fixed;left:50%;bottom:calc(84px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);z-index:50;display:flex;flex-direction:column;gap:6px;align-items:center;pointer-events:none}
#toast div{background:var(--fg);color:var(--bg);padding:9px 14px;border-radius:10px;font-weight:600;font-size:13.5px;box-shadow:var(--shadow);max-width:90vw}
@media(min-width:900px){#toast{bottom:24px}}
.banner{padding:10px 14px;border-radius:10px;background:var(--warn-soft);color:var(--warn);font-weight:600;font-size:13.5px}
.billbox{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-size:12.5px;white-space:pre-wrap;background:var(--surface2);border-radius:10px;padding:12px;line-height:1.5}
.kv{display:grid;grid-template-columns:1fr auto;gap:6px 12px;font-size:14px}
.kv b{font-weight:800}
.hr{height:1px;background:var(--line);margin:4px 0}
.dot{width:8px;height:8px;border-radius:50%;display:inline-block}
.search{position:relative}
.search svg{position:absolute;left:11px;top:50%;transform:translateY(-50%);width:16px;height:16px;color:var(--muted)}
.search .input{padding-left:34px}
.extras{display:flex;flex-wrap:wrap;gap:6px}
.mapbtn{width:40px;height:40px;flex:none;border-radius:12px;display:grid;place-items:center;background:var(--info-soft);color:var(--info)}
.mapbtn svg{width:20px;height:20px}
.mapbtn.approx{background:var(--surface2);color:var(--muted);border:1px dashed var(--line)}
.mapbtn.none{background:transparent;color:var(--line);border:1px dashed var(--line)}
.btn svg{width:17px;height:17px}
.eyebrow{font-size:10.5px;letter-spacing:.14em;font-weight:800;color:var(--accent-ink);text-transform:uppercase;margin-bottom:2px}
@media(min-width:900px){.eyebrow{display:none}}
.hero{background:linear-gradient(135deg,var(--hero1),var(--hero2));color:var(--hero-fg);border-radius:18px;padding:18px 18px 16px;box-shadow:var(--shadow)}
.hero-eyebrow{font-size:11.5px;letter-spacing:.08em;text-transform:uppercase;font-weight:700;color:var(--hero-muted)}
.hero-load{display:flex;flex-wrap:wrap;gap:6px 18px;margin-top:6px;font-size:15px;color:var(--hero-muted)}
.hero-load b{font-size:30px;font-weight:800;letter-spacing:-.02em;color:var(--hero-fg);margin-right:2px}
.hero-btn{background:rgba(255,255,255,.14);color:var(--hero-fg);border-color:rgba(255,255,255,.25)}
.hero-sub{margin-top:14px;font-size:13px;color:var(--hero-muted)}
.hero-sub b{color:var(--hero-fg)}
.hero-bar{background:var(--hero-bar);margin-top:6px}
.hero-bar i{background:var(--hero-fg)}
.grid.tight{gap:12px}
@media(max-width:760px){.grid.g2.tight{grid-template-columns:1fr}}
.tbl.compact th,.tbl.compact td{padding:7px 8px}
.wa{display:inline-grid;place-items:center;width:32px;height:32px;border-radius:9px;background:var(--accent-soft);color:var(--accent-ink)}
.wa svg{width:17px;height:17px}
.help p{margin:4px 0 0;color:var(--muted);font-size:14px}
.only-m{display:flex}.only-d{display:none}
@media(min-width:720px){.only-m{display:none}.only-d{display:block}}
.grid.g3.keep{grid-template-columns:repeat(3,minmax(0,1fr))}
@media(max-width:640px){.grid.g3.keep .stat .v{font-size:17px}.grid.g3.keep .card{padding:10px 12px}}
.login{position:fixed;inset:0;z-index:30;background:var(--bg);display:flex;align-items:center;justify-content:center;padding:20px}
.login .box{width:100%;max-width:380px}
.login .brand{justify-content:center;padding-bottom:22px}
.login .brand .mark{width:46px;height:46px;border-radius:14px;font-size:22px}
.login .brand b{font-size:22px}
.roles{display:grid;grid-template-columns:repeat(2,1fr);gap:8px}
.roles button{padding:12px 10px;border-radius:12px;border:1.5px solid var(--line);background:var(--surface);font-weight:700}
.roles button.on{border-color:var(--accent);background:var(--accent-soft);color:var(--accent-ink)}
.pin{display:flex;justify-content:center;gap:12px;margin:18px 0 10px}
.pin i{width:16px;height:16px;border-radius:50%;border:2px solid var(--line);display:block}
.pin i.f{background:var(--accent);border-color:var(--accent)}
.pad{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.pad button{height:56px;border-radius:14px;background:var(--surface);border:1px solid var(--line2);font-size:22px;font-weight:700;box-shadow:var(--shadow)}
.pad button:active{background:var(--surface2)}
.pad button.ghost{background:transparent;border:0;box-shadow:none;font-size:14px;color:var(--muted)}
.pill{display:inline-flex;align-items:center;gap:6px;padding:4px 10px;border-radius:999px;background:var(--surface2);font-size:12px;font-weight:700;color:var(--muted)}
.pill.off{background:var(--warn-soft);color:var(--warn)}
.setup{max-width:560px;margin:40px auto;padding:0 16px}
.setup ol{padding-left:20px;line-height:1.6}
.setup code{background:var(--surface2);padding:2px 6px;border-radius:6px;font-size:13px}
.confirm{display:flex;gap:8px;align-items:center;flex-wrap:wrap}

.plw{overflow:auto;border:1px solid var(--line2);border-radius:var(--r);background:var(--surface);max-height:calc(100vh - 300px);min-height:300px}
.plt{border-collapse:separate;border-spacing:0;table-layout:fixed}
.plt th{position:sticky;top:0;z-index:3;background:var(--surface2);font-size:11.5px;padding:9px 10px;text-align:left;color:var(--muted);border-bottom:1px solid var(--line);border-right:1px solid var(--line2)}
.plt td{vertical-align:top;padding:9px 10px;border-bottom:1px solid var(--line2);border-right:1px solid var(--line2);font-size:13px}
.plt tr.plok td{background:color-mix(in srgb,var(--accent-soft) 40%,var(--surface))}.plt tr.plin td{color:var(--muted)}
.plt .plgrp td{background:var(--bg);padding:7px 12px}.plc{text-align:center}.plc .ck{width:32px;height:32px;border-radius:9px;margin:0 auto}
.plph{margin-top:5px;border:1px solid var(--line);background:var(--surface2);border-radius:7px;padding:3px 8px;font-weight:700;font-size:12.5px}
.plflag{margin-top:6px;font-size:11.5px;font-weight:700;color:var(--warn)}
.plfix{width:100%;border:0;background:transparent;resize:none;min-height:54px;font:inherit;font-size:12.5px;color:var(--fg);outline:none}
.plvc{position:relative;background:var(--warn-soft);border-left:3px solid var(--warn);border-radius:6px;padding:5px 22px 5px 8px;margin-bottom:5px;font-size:12.5px}.plvc.last{border-left-color:var(--danger)}
.plvc small{display:block;font-size:11px;font-weight:700;color:var(--warn)}
.plx{position:absolute;top:3px;right:4px;width:18px;height:18px;opacity:.6;font-size:15px;line-height:1}

const $=(s,r=document)=>r.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const inr=n=>{n=Math.round(n||0);return (n<0?'−₹':'₹')+Math.abs(n).toLocaleString('en-IN')};
const L=n=>{n=+n||0;return (Math.round(n*100)/100).toString()};

const MON=['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];

const extrasPresets=()=>Array.isArray(settings().extras)?settings().extras:[];

const ratesOf=c=>({...defRates(),...(c.rates||{}),...(window.rateNow?rateNow(c):{})});

function bottlesOf(q){let b=0,s=0;PRODUCTS.forEach(p=>{const v=+(q&&q[p.k])||0;if(v<=0)return;const B=Math.floor(v+1e-9);const rem=v-B;b+=B;if(rem>1e-9)s+=Math.ceil(rem/0.5-1e-9)});return {b,s}}

/* ---------- computations ---------- */
function calcAmount(q,x,rates){let a=0;PRODUCTS.forEach(p=>a+=(+q[p.k]||0)*(+rates[p.k]||0));(x||[]).forEach(e=>a+=+e.a||0);return Math.round(a*100)/100}
function rowOf(date,cid){const d=S.days[date];return d&&d.rows?d.rows[cid]:null}
/* chhutti: customer ne kuch din ke liye band karaya (c.holds = [{from,to,note}]) */
const onHold=(c,date)=>(c.holds||[]).some(h=>h.from<=date&&date<=h.to);
function dueOn(c,date){
  if(c.status!=='active')return false;
  if(onHold(c,date))return false;
  if(c.schedule==='custom')return (c.wdays||[]).map(Number).includes(new Date(date+'T12:00:00').getDay());
  if(c.schedule==='alternate'){const y=rowOf(addDays(date,-1),c.id);if(y&&y.s==='d')return false}
  return true}
function todaysList(date,boy){
  const out=[];
  for(const c of Object.values(S.customers)){
    if(boy!=='all'&&c.boy!==boy)continue;
    const r=rowOf(date,c.id);
    if(r||dueOn(c,date))out.push({c,r});
  }
  return out.sort((a,b)=>(a.c.boy||'').localeCompare(b.c.boy||'')||((a.c.seq??9999)-(b.c.seq??9999))||a.c.name.localeCompare(b.c.name))}
function periodRange(month,period){const n=dim(month);if(period==='h1')return [month+'-01',month+'-15'];if(period==='h2')return [month+'-16',month+'-'+String(n).padStart(2,'0')];return [month+'-01',month+'-'+String(n).padStart(2,'0')]}
function deliveredRows(cid,from,to){const out=[];for(const d in S.days){if(from&&d<from||to&&d>to)continue;const r=S.days[d].rows&&S.days[d].rows[cid];if(r&&r.s==='d')out.push({date:d,...r})}return out.sort((a,b)=>a.date<b.date?-1:1)}
function paymentsOf(cid,from,to){return Object.values(S.payments).filter(p=>p.cid===cid&&(!from||p.date>=from)&&(!to||p.date<=to)).sort((a,b)=>a.date<b.date?-1:1)}
/* adjustments: discount / extra charge / write-off (collection "adjust"). Charge baki badhata hai, baaki ghatate hain */
function adjOf(cid,from,to){return Object.values(S.adjust||{}).filter(a=>a.cid===cid&&(!from||a.date>=from)&&(!to||a.date<=to)).sort((a,b)=>a.date<b.date?-1:1)}
const adjNet=a=>(a.type==='charge'||a.type==='refund')?(+a.amt||0):-(+a.amt||0);
function mapOf(c){
  const m=String(c.map||'').trim();
  if(/^https?:\/\//i.test(m))return {url:m,exact:true};
  const q=[c.address,c.area].filter(Boolean).join(', ');
  if(q)return {url:'https://www.google.com/maps/search/?api=1&query='+encodeURIComponent(q+', Jaipur'),exact:false};
  return null}
function mapBtn(c,cls){const m=mapOf(c);if(!m)return `<span class="mapbtn none ${cls||''}" title="Map link nahi hai">${ICONS.pin}</span>`;
  return `<a class="mapbtn ${m.exact?'':'approx'} ${cls||''}" href="${esc(m.url)}" target="_blank" rel="noopener" title="${m.exact?'Google Maps me kholo':'Exact link nahi — address se search'}" aria-label="Map">${ICONS.pin}</a>`}
const sum=(arr,f)=>arr.reduce((t,x)=>t+(+f(x)||0),0);
function balanceUpto(c,upto){ // opening + delivered amounts − payments, up to date inclusive (null = all)
  return (+c.openingDue||0)+sum(deliveredRows(c.id,null,upto),r=>r.a)-sum(paymentsOf(c.id,null,upto),p=>p.amt)+sum(adjOf(c.id,null,upto),adjNet)}
function billFor(c,month,period){
  const [from,to]=periodRange(month,period);
  const rows=deliveredRows(c.id,from,to);
  const pays=paymentsOf(c.id,from,to);
  const lines=PRODUCTS.map(p=>({...p,name:p.l,l:sum(rows,r=>r.q&&r.q[p.k]),a:sum(rows,r=>(+(r.q&&r.q[p.k])||0)*(+(r.r&&r.r[p.k])||0))})).filter(x=>x.l>0);
  const extras=sum(rows,r=>sum(r.x||[],e=>e.a));
  const amount=sum(rows,r=>r.a);
  const paid=sum(pays,p=>p.amt);
  const prev=balanceUpto(c,addDays(from,-1));
  const adj=adjOf(c.id,from,to),adjAmt=sum(adj,adjNet);
  return {c,from,to,rows,pays,lines,extras,amount,paid,prev,adj,adjAmt,closing:prev+amount+adjAmt-paid}}
function billText(b){
  const c=b.c;const per=fmtShort(b.from)+' – '+fmtShort(b.to)+' '+b.from.slice(0,4);
  const st=settings();const co=st.company||'Oritic';
  let t=`*${co}* – Doodh ka bill\n${c.name}\n${per}\n\n`;
  b.lines.forEach(x=>{const rate=x.l?x.a/x.l:0;t+=`${x.name}: ${L(x.l)} L`+(rate?` × ₹${L(rate)}`:'')+` = ${inr(x.a)}\n`});
  if(b.extras)t+=`Paneer / dahi / other: ${inr(b.extras)}\n`;
  t+=`Delivery days: ${b.rows.length}\n----------------\nIs period ka bill: ${inr(b.amount)}\n`;
  if(Math.abs(b.prev)>0.5)t+=`Pichla baki: ${inr(b.prev)}\n`;
  (b.adj||[]).forEach(a=>{t+=(a.type==='charge'?'Extra charge':a.type==='refund'?'Paisa wapas diya':a.type==='writeoff'?'Write-off':'Discount')+`: ${a.type==='charge'||a.type==='refund'?'+':'−'}${inr(a.amt)}`+(a.note?` (${a.note})`:'')+'\n'});
  if(b.paid)t+=`Jama (paid): ${inr(b.paid)}\n`;
  t+=`*Kul baki: ${inr(b.closing)}*\n`;
  if(st.upi)t+=`\nUPI: ${st.upi}`;
  t+=`\n${st.billNote||'Dhanyavaad 🙏'}`;
  return t}

const Q={};
function queue(k,fn){Q[k]=(Q[k]||Promise.resolve()).then(fn).catch(e=>{console.error(e);toast('Save nahi hua: '+(e&&e.message||e))});return Q[k]}
async function writeRows(date,rows){ // rows: {cid: row}
  if(!canWrite()){toast('Aapko write permission nahi hai');return}
  const d=S.days[date]||(S.days[date]={date,rows:{}});
  for(const cid in rows){const prev=d.rows[cid];if(prev&&prev.br!=null&&rows[cid].br==null){rows[cid].br=prev.br;if(prev.brS!=null)rows[cid].brS=prev.brS;if(prev.brB!=null)rows[cid].brB=prev.brB}
    /* rate history ho to us din ka rate lagao (js/account.js) */
    if(window.priceRow)priceRow(S.customers[cid],date,rows[cid])}
  Object.assign(d.rows,rows);render();
  const FP=firebase.firestore.FieldPath;
  /* fix R-1: mergeFields se har customer ki row poori replace hoti hai. Pehle merge:true purane pl/qty fields chhod deta tha, isliye tick hatane pe tick wapas aa jata tha */
  return queue('day:'+date,async()=>{const ref=S.db.doc('days/'+date);
    await ref.set({date,rows},{mergeFields:['date',...Object.keys(rows).map(cid=>new FP('rows',cid))]});return true})}
function makeRow(c,s,q,x,note,by){const rates=ratesOf(c);q=q||orderOf(c);x=x||[];const bt=bottlesOf(q);return {s,q,x,a:s==='d'?calcAmount(q,x,rates):0,r:rates,bo:s==='d'?bt.b+bt.s:0,by:by||c.boy||'',n:note||'',t:Date.now()}}

const keepPl=(row,r)=>{if(r&&r.pl)row.pl=1;return row};

/* ---- Today ---- */
function vToday(){
  if(!isOwner()){S.boy=S.me;S.date=todayISO()}else if(S.boy!=='all'&&!boys().includes(S.boy))S.boy='all';
  const date=S.date;const list=todaysList(date,S.boy);
  const pending=list.filter(x=>!x.r||x.r.s==='p');const done=list.filter(x=>x.r&&x.r.s==='d');
  const load={};PRODUCTS.forEach(p=>load[p.k]=0);const BT=btNew();const RB={s:0,b:0,u:0};list.forEach(({r})=>{const o=brSplit(r);RB.s+=o.s;RB.b+=o.b;RB.u+=o.u});
  const dn=(S.days[date]||{}).dnote||{};
  list.forEach(({c,r})=>{const q=r&&r.s==='k'?null:(r&&(r.s==='d'||r.pl)?r.q:orderOf(c));if(q){PRODUCTS.forEach(p=>load[p.k]+=+q[p.k]||0);btAdd(BT,q)}});
  let lastArea='';
  const rows=list.map(({c,r})=>{
    const st=r?r.s:'p';const it=rowItems(c,r);const q=it.q;
    const grp=S.boy==='all'?(c.boy||'—'):(c.area||'—').trim();const hd=grp.toLowerCase()!==lastArea.toLowerCase()?`<div class="areahd">${esc(grp)}</div>`:'';lastArea=grp;
    return hd+`<div class="drow ${st==='d'?'done':st==='k'?'skip':''}">
      <button class="ck ${st==='d'?'on':st==='k'?'skip':''}" data-act="toggleDone" data-id="${c.id}" aria-label="Done">${st==='k'?ICONS.skip:ICONS.check}</button>
      <button class="body" data-act="editRow" data-id="${c.id}">
        <div class="nm">${esc(c.name)} ${c.schedule==='alternate'?'<span class="badge b">Alt</span>':''}${c.status!=='active'?'<span class="badge y">Paused</span>':''}</div>
        <div class="qt"><b>${qtyText(q)}</b> ${st!=='k'?btHtml(bottlesOf(q)):''}${st!=='k'&&it.x.length?' + '+esc(extrasText(it.x)):''}${st==='k'?' · <span style="color:var(--warn)">skip</span>':''}${r&&r.n?' · '+esc(r.n):''}${r&&r.br?' · <span style="color:var(--accent)">'+brText(r)+' wapas</span>':''}${S.boy==='all'?' · '+esc(c.area||''):''}</div>
        ${c.notes?`<div class="qt" style="color:var(--warn);font-weight:700">📌 ${esc(c.notes)}</div>`:''}
        ${varsOf(c).map(v=>`<div class="qt" style="color:var(--info);font-weight:600">💬 ${esc(v.t)}</div>`).join('')}
      </button>
      ${mapBtn(c)}
      <button class="btn xs ${st==='k'?'w':'o'}" data-act="skipRow" data-id="${c.id}">${st==='k'?'Undo':'Skip'}</button>
    </div>`}).join('');
  const html=`
  <div class="stack">
    ${isOwner()?`<div class="row sp">
      <div class="row"><button class="btn sm o" data-act="dateShift" data-n="-1">‹</button><button class="btn sm" data-act="dateToday"><b>${date===todayISO()?'Aaj · ':''}${fmtDate(date)}</b></button><button class="btn sm o" data-act="dateShift" data-n="1" ${date>=todayISO()?'disabled':''}>›</button></div>
      <input type="date" class="input" style="width:auto;padding:6px 10px" value="${date}" data-act="datePick" max="${todayISO()}">
    </div>
    ${date<todayISO()?`<div class="banner">Pichli tareekh (${fmtDate(date)}) edit ho rahi hai. Jo quantity badlogi, wahi bill aur ledger me jayegi.</div>`:''}
    ${boyChips(S.boy,'setBoy')}`:`<div class="row sp"><b>${fmtDate(date)}</b><button class="btn sm o" data-act="routeOrder" data-b="${esc(S.me)}">⇅ Order badlo</button></div>`}
    ${isOwner()?`<div><button class="btn sm o" data-act="routeOrder" data-b="${esc(S.boy)}">⇅ ${S.boy!=='all'?esc(S.boy)+' ka order':'Customer order'} badlo</button></div>`:''}
    <div class="card" style="padding:12px 14px">
      <div class="row sp wrap"><div class="small"><b>${done.length}/${list.length}</b> done · ${pending.length} pending</div><div class="small muted">${PRODUCTS.filter(p=>load[p.k]>0).map(p=>`<b style="color:var(--fg)">${L(load[p.k])}L</b> ${p.sh}`).join(' · ')||'—'}</div></div>
      <div class="pbar" style="margin-top:8px"><i style="width:${list.length?Math.round(done.length/list.length*100):0}%"></i></div>
    </div>
    ${btBreak(BT,(date===todayISO()?'Aaj':fmtShort(date))+' ki bottles'+(S.boy!=='all'?' · '+esc(S.boy):''))}
    ${RB.s||RB.b||RB.u?`<div class="card" style="padding:10px 12px"><div class="row sp wrap"><b style="font-size:14px">Khali bottles wapas aayi</b><div class="row">${RB.s?`<span class="bchip">${RB.s} × ½L</span>`:''}${RB.b?`<span class="bchip">${RB.b} × 1L</span>`:''}${RB.u?`<span class="bchip">${RB.u} bina size</span>`:''}</div></div></div>`:''}
    ${isOwner()?`<div class="card"><div class="row sp wrap"><h3>Dispatch notes · ${fmtDate(date)}</h3><span class="small muted">${dn.by?'Last save: '+esc(dn.by)+(dn.t?' · '+new Date(dn.t).toLocaleString('en-IN',{day:'numeric',month:'short',hour:'numeric',minute:'2-digit'}):''):''}</span></div>
      <textarea class="input dnote" style="margin-top:8px" data-act="dnote" data-d="${date}" placeholder="Is din ka koi dispatch note nahi likha. Yahan likh sakte ho…">${esc(dn.t0||'')}</textarea>
      <div class="small muted" style="margin-top:4px">Kal tab wale dispatch notes hi yahan us din ke hisaab se dikhte hain. Box se bahar click karte hi save.</div></div>`
     :(dn.t0?`<div class="card"><h3>Dispatch notes</h3><div style="margin-top:6px;white-space:pre-wrap">${esc(dn.t0)}</div></div>`:'')}
    <div class="list">${rows||emptyBox('Aaj koi delivery due nahi','<span class="small">Customer paused ho sakte hain, ya alternate day.</span>')}</div>
    <div class="row wrap">
      ${pending.length?`<button class="btn p" data-act="allDone">Baaki sab done karo (${pending.length})</button>`:''}
      <button class="btn o" data-act="addToday">+ Aur customer aaj</button>
    </div>
  </div>`;
  return {title:'Aaj ki delivery',html}}

/* ---- Customers ---- */
function vCustomers(){

  if(byRoute){const g={};all.forEach(c=>(g[c.boy||'']=g[c.boy||'']||[]).push(c));Object.values(g).forEach(arr=>arr.sort((a,b)=>((a.seq??9999)-(b.seq??9999))||a.name.localeCompare(b.name)).forEach((c,i)=>pos[c.id]=i+1));

     <button class="btn sm o" data-act="routeOrder" data-b="${esc(S.cboy)}">⇅ Order badlo</button></div></div>
    <div class="list">${list.map(c=>{const rt=ratesOf(c);let hd='';if(byRoute&&S.cboy==='all'&&c.boy!==lastG){lastG=c.boy;hd=`<div class="areahd">${esc(c.boy||'—')}</div>`}const o=orderOf(c);const rateStr=PRODUCTS.filter(p=>o[p.k]>0).map(p=>'₹'+rt[p.k]).join('/');
      return hd+`<div class="item">${byRoute?`<span class="cpos">${pos[c.id]}</span>`:''}<button class="grow click" data-act="openCustomer" data-id="${c.id}" style="text-align:left"><div class="t">${esc(c.name)} ${c.schedule==='alternate'?'<span class="badge b">Alt</span>':''}</div><div class="s">${esc(c.area||'—')} · ${esc(c.boy||'—')} · ${qtyText(o)}${rateStr?' @ '+rateStr:''}</div></button><div class="r">${c.status==='active'?'<span class="badge g">Active</span>':'<span class="badge y">Paused</span>'}</div>${mapBtn(c)}</div>`}).join('')||emptyBox('Koi customer nahi mila')}</div>
  </div>`;

      <div class="grid g2">
        <div class="field"><label class="f">Owner PIN</label><input class="input" id="stPinOwner" type="password" autocomplete="new-password" inputmode="numeric" maxlength="6" value="${isAdmin()?esc((settings().pins||{}).owner||'1234'):''}"><button type="button" class="btn xs o" style="margin-top:6px" onclick="const i=document.getElementById('stPinOwner');i.type=i.type==='password'?'text':'password'">PIN dikhao / chhupao</button></div>
      </div></div>

    <div class="card"><h3>Other products (paneer, dahi, ghee…)</h3><div class="small muted" style="margin:4px 0 8px">Ab ye <b>Product master</b> me manage hote hain (${products().length} products).</div><button class="btn o" data-act="go" data-r="products">Product master kholo</button></div>
    <div class="card"><h3>Meter / KM incentive</h3><div class="grid g2" style="margin-top:8px">

      <div class="field"><label class="f">Raat 11 baje Excel backup apne aap download</label><select class="input" id="stAuto"><option value="1" ${settings().autoExport!==false?'selected':''}>Haan (panel khula ho to)</option><option value="0" ${settings().autoExport===false?'selected':''}>Nahi</option></select></div></div></div>
    ${isAdmin()?'<button class="btn p" data-act="saveSettings">Save settings</button>':'<div class="banner">Ye settings sirf owner badal sakta hai. Aap dekh sakte ho.</div>'}
    <button class="btn o" data-act="help">Kaise use karein? (guide)</button>
    <div class="card"><h3>Data</h3><div class="small muted" style="margin:4px 0 10px">${Object.keys(S.customers).length} customers · ${Object.keys(S.days).length} delivery days · ${Object.keys(S.payments).length} payments</div>
      <div class="row wrap">
        <label class="btn o" style="cursor:pointer" ${isAdmin()?'':'hidden'}>Customers import (JSON)<input type="file" accept=".json,application/json" id="impFile" hidden></label>
        <button class="btn o" data-act="backup" ${isAdmin()?'':'hidden'}>Backup download</button>
        <button class="btn o" data-act="xlsx" data-d="${addDays(todayISO(),1)}">Excel backup (kal ki delivery)</button>

  </div>`;
  return {html}}

/* ---------- sheets ---------- */
function openSheet(title,html){stopCam();$('#shTitle').textContent=title;$('#shBody').innerHTML=html;$('#sheet').hidden=false;document.body.style.overflow='hidden'}
function closeSheet(){stopCam();$('#sheet').hidden=true;$('#shBody').innerHTML='';document.body.style.overflow=''}
function stepper(id,val,step){return `<div class="step"><button type="button" data-act="step" data-t="${id}" data-n="${-step}">−</button><input id="${id}" type="number" inputmode="decimal" step="${step}" min="0" value="${val}"><button type="button" data-act="step" data-t="${id}" data-n="${step}">+</button></div>`}

function sheetRow(cid){
  const c=S.customers[cid];if(!c)return;const r=rowOf(S.date,cid);const {q,x}=rowItems(c,r);
  const presets=products().filter(p=>p.on!==false).slice(0,12);
  openSheet(c.name,`
    <div class="small muted" style="margin-bottom:8px">${esc(c.area||'')} · ${esc(c.boy||'')} · ${fmtDate(S.date)}</div>
    ${c.notes?`<div class="instr">📌 ${esc(c.notes)}</div>`:''}
    ${varsOf(c).map(v=>`<div class="vcm">💬 ${esc(v.t)}<small>${v.by?esc(v.by)+' · ':''}${fmtShort(v.till)} tak</small></div>`).join('')}
    <div class="qgrid" style="margin-top:8px">${PRODUCTS.map(p=>`<div><b>${p.l}</b><div class="small muted">₹${ratesOf(c)[p.k]}/L</div></div>${stepper('q_'+p.k,q[p.k]||0,0.5)}`).join('')}</div>
    <div class="small muted" style="margin-top:6px">Bottles: <span id="rowBt">${btHtml(bottlesOf(q))}</span></div>
    <div style="margin-top:16px"><label class="f">Other products</label>
      <div class="extras" id="xList">${x.map((e,i)=>`<span class="badge n" style="font-size:13px;padding:6px 10px">${esc(e.n)} ${inr(e.a)} <button data-act="xDel" data-i="${i}" style="margin-left:4px;font-weight:800">×</button></span>`).join('')}</div>
      <div class="extras" style="margin-top:8px">${presets.map(p=>{const lr=lastRate(cid,p.id,p.n);const rt=lr!=null?lr:+p.a||0;return `<button class="chip" data-act="xAdd" data-n="${esc(p.n)}" data-pid="${esc(p.id)}" data-a="${rt}">+ ${esc(p.n)} ${inr(rt)}</button>`}).join('')}</div>
      ${prodForm('x',cid)}
    </div>
    <div style="margin-top:12px">${brSteppers('rBr',r)}<div class="row sp" style="margin-top:6px"><span class="small muted">Customer ke paas khali bottles</span><b style="font-size:18px">${bottleBal(c)}</b></div>${balHtml(c)}</div>
    <div class="row sp" style="margin-top:14px;padding:10px 12px;border-radius:10px;background:var(--surface2)"><span class="small muted">Aaj ka bill</span><b id="liveTotal">${inr(calcAmount(q,x,ratesOf(c)))}</b></div>
    <div style="margin-top:12px"><label class="f">Note (optional)</label><input class="input" id="rNote" value="${esc(r&&r.n||'')}" placeholder="e.g. bottle wapas nahi di"></div>
    <div class="row wrap" style="margin-top:16px">
      <button class="btn p grow" data-act="rowSave" data-id="${cid}" data-s="d">✓ Delivered</button>
      <button class="btn w" data-act="rowSave" data-id="${cid}" data-s="k">Skip (nahi gaya)</button>
      ${r?`<button class="btn o" data-act="rowSave" data-id="${cid}" data-s="p">Pending karo</button>`:''}
    </div>
    <div class="row sp wrap" style="margin-top:14px"><button class="btn sm o" data-act="openCustomer" data-id="${cid}">Customer profile</button>${mapOf(c)?`<a class="btn sm o" href="${esc(mapOf(c).url)}" target="_blank" rel="noopener">${ICONS.pin} Map</a>`:''}<button class="btn sm o" data-act="bottle" data-id="${cid}" data-n="-1">Bottle wapas (−1) · ${bottleBal(c)}</button></div>`);
  $('#shBody').dataset.extras=JSON.stringify(x)}
function liveTotal(){const el=$('#liveTotal');if(!el)return;const cid=($('[data-act=rowSave]')||{}).dataset;if(!cid)return;const c=S.customers[cid.id];if(!c)return;const {q,x}=readRowSheet();el.textContent=inr(calcAmount(q,x,ratesOf(c)));const b=$('#rowBt');if(b)b.innerHTML=btHtml(bottlesOf(q))}
function readRowSheet(){const q={};PRODUCTS.forEach(p=>q[p.k]=Math.max(0,+$('#q_'+p.k).value||0));const x=JSON.parse($('#shBody').dataset.extras||'[]');return {q,x,n:$('#rNote').value.trim()}}
function renderExtras(){liveTotal();const x=JSON.parse($('#shBody').dataset.extras||'[]');$('#xList').innerHTML=x.map((e,i)=>`<span class="badge n" style="font-size:13px;padding:6px 10px">${esc(e.n)} ${inr(e.a)} <button data-act="xDel" data-i="${i}" style="margin-left:4px;font-weight:800">×</button></span>`).join('')}

function sheetCustomer(cid){

    <div class="kv">
      <span class="muted">Phone</span><span><b>${esc(c.phone||'—')}</b> ${c.phone?`<button class="btn xs" data-act="copy" data-t="${esc(c.phone)}">Copy</button> <a class="btn xs" href="https://wa.me/91${cleanPhone(c.phone)}" target="_blank" rel="noopener">WhatsApp</a>`:''}</span>

      <span class="muted">Address</span><span>${esc(c.address||'—')}</span>
      <span class="muted">Landmark</span><span>${esc(c.landmark||'—')}</span>
      <span class="muted">Schedule</span><span>${esc(schedText(c))}</span>
      <span class="muted">Customer since</span><span>${custSince(c)?fmtDate(custSince(c))+' '+custSince(c).slice(0,4):'—'}</span>
      <span class="muted">Order</span><span><b>${qtyText(o)}</b></span>
      <span class="muted">Rates</span><span>${PRODUCTS.map(p=>p.sh+' ₹'+rt[p.k]).join(' · ')}</span>
      ${c.notes?`<span class="muted">Note</span><span>${esc(c.notes)}</span>`:''}
    </div>
    ${(()=>{const m=mapOf(c);return m?`<div class="row" style="margin-top:12px"><a class="btn p" style="flex:1;min-width:0" href="${esc(m.url)}" target="_blank" rel="noopener">${ICONS.pin} ${m.exact?'Google Maps me kholo':'Address se search'}</a><button class="btn o" data-act="copy" data-t="${esc(c.name+' — '+(c.address||'')+'\n'+m.url)}">Location copy</button></div>${m.exact?'':'<div class="small" style="color:var(--warn);margin-top:6px">Is customer ka exact map link nahi hai — Edit me link daal do.</div>'}`:'<div class="small" style="color:var(--warn);margin-top:12px">Map link aur address dono nahi hain — Edit me daal do.</div>'})()}
    <div class="hr" style="margin:12px 0"></div>
    <div class="grid g3">
      <div class="stat"><div class="l">${fmtMonth(month)}</div><div class="v" style="font-size:18px">${inr(b.amount)}</div><div class="s">${b.rows.length} days</div></div>
      <div class="stat"><div class="l">Jama (${MON[+month.slice(5)-1]})</div><div class="v" style="font-size:18px">${inr(b.paid)}</div></div>
      <div class="stat"><div class="l">Kul baki</div><div class="v" style="font-size:18px;color:${bal>0.5?'var(--danger)':'var(--accent)'}">${inr(bal)}</div><div class="s">bottles: ${bottleBal(c)}</div></div>
    </div>
    <div class="row wrap" style="margin-top:14px">
      <button class="btn p" data-act="openBill" data-id="${cid}">Bill dekho</button>
      <button class="btn" data-act="addPayment" data-id="${cid}">Payment lo</button>
      ${isOwner()?`<button class="btn" data-act="editCustomer" data-id="${cid}">Edit</button>
      <button class="btn o" data-act="togglePause" data-id="${cid}">${c.status==='active'?'Pause karo':'Resume karo'}</button>`:''}
    </div>
    <h3 style="margin-top:18px">Recent deliveries</h3>
    <div style="margin-top:6px">${recent.map(r=>`<div class="row sp small" style="padding:6px 0;border-bottom:1px solid var(--line2)"><span>${fmtDate(r.date)}</span><span class="muted">${qtyText(r.q)}${r.x&&r.x.length?' + '+esc(extrasText(r.x)):''}</span><b>${inr(r.a)}</b></div>`).join('')||'<div class="small muted">Abhi koi delivery record nahi</div>'}</div>
    ${commentHistoryHtml(c)}`)}

    <div class="stack">

        <div class="small muted" style="margin-top:4px">Customer ki WhatsApp location ya Google Maps "Share" wala link yahan paste karo.</div></div>
      <div class="grid g3">

        <div class="field"><label class="f">Status</label><select class="input" id="fStatus"><option value="active" ${c.status==='active'?'selected':''}>Active</option><option value="paused" ${c.status!=='active'?'selected':''}>Paused</option></select></div>
      </div>
      <div class="field" id="fWd" ${c.schedule==='custom'?'':'hidden'}><label class="f">Kin dino me delivery (custom)</label><div class="wdays">${DOW.map((w,i)=>`<label><input type="checkbox" data-wd="${i}" ${(c.wdays||[]).map(Number).includes(i)?'checked':''}> ${w}</label>`).join('')}</div></div>

        ${PRODUCTS.map(p=>`<tr><td><b>${p.sh}</b></td><td><input class="input" style="width:84px" type="number" inputmode="decimal" step="0.5" min="0" id="fQ_${p.k}" value="${o[p.k]||0}"></td><td><input class="input" style="width:84px" type="number" inputmode="decimal" id="fR_${p.k}" value="${rt[p.k]}"></td></tr>`).join('')}

      <div class="small muted" style="margin-top:-6px">Bottle balance = opening + delivery pe gayi bottles − wapas aayi. Abhi: <b>${cid?bottleBal(c):0}</b></div>
      <div class="field"><label class="f">Notes</label><textarea class="input" id="fNotes" placeholder="e.g. gate pe rakhna, call karke jana">${esc(c.notes||'')}</textarea></div>
      <button class="btn p block" data-act="custSave" data-id="${cid||''}">Save</button>
      ${cid?`<div class="confirm" id="delWrap"><button class="btn o" data-act="custDelAsk">Customer delete…</button></div>`:''}
    </div>`)}

function sheetBill(cid){

  openSheet('Bill · '+c.name,`
    <div class="row sp wrap" style="margin-bottom:10px">

      <div class="seg">${[['full','Pura'],['h1','1–15'],['h2','16–'+dim(S.month)]].map(([v,l])=>`<button class="${S.period===v?'on':''}" data-act="setPeriod" data-v="${v}" data-bill="${cid}">${l}</button>`).join('')}</div>

      <button class="btn o" data-act="addPayment" data-id="${cid}">Payment lo</button>
    </div>

    ${b.rows.map(r=>`<tr><td>${fmtShort(r.date)}</td><td>${qtyText(r.q)}</td><td class="small muted">${esc(extrasText(r.x))}</td><td class="n">${inr(r.a)}</td></tr>`).join('')||'<tr><td colspan="4" class="muted">Koi delivery nahi</td></tr>'}

function sheetPayment(cid){
  const c=cid&&S.customers[cid];
  openSheet('Payment lo',`
    <div class="stack">
      <div class="field"><label class="f">Customer</label>
        ${c?`<div class="row sp"><b id="payCust" data-id="${c.id}">${esc(c.name)} <span class="muted small">· baki ${inr(balanceUpto(c,null))}</span></b><button class="btn xs" data-act="payPick">Badlo</button></div>`:`<div class="search">${ICONS.search}<input class="input" id="payQ" placeholder="Naam ya phone type karo" autocomplete="off"></div><div class="list" id="payRes" style="margin-top:6px;max-height:200px;overflow:auto"></div><b id="payCust" data-id=""></b>`}
      </div>
      <div class="grid g2">
        <div class="field"><label class="f">Amount (₹) *</label><input class="input" id="payAmt" type="number" inputmode="decimal" placeholder="${c&&balanceUpto(c,null)>0?'Baki '+inr(balanceUpto(c,null)):'0'}" value=""><div id="payFullW">${c&&balanceUpto(c,null)>0?`<button type="button" class="btn xs o" style="margin-top:6px" data-act="payFull" data-v="${Math.round(balanceUpto(c,null))}">Pura baki bharo (${inr(balanceUpto(c,null))})</button>`:''}</div></div>
        <div class="field"><label class="f">Date</label><input class="input" id="payDate" type="date" value="${todayISO()}" max="${todayISO()}"></div>
      </div>
      <div class="grid g2"><div class="field"><label class="f">Mode</label><div class="seg" id="payMode"><button class="on" data-mode="cash">Cash</button><button data-mode="online">UPI / QR</button></div></div>
        <div class="field"><label class="f">Kisne liya</label><select class="input" id="payVia">${window.rcvOpts?rcvOpts():`<option>${esc(S.me||'')}</option>`}</select></div></div>

        <label class="btn o" style="cursor:pointer">${ICONS.cam} Screenshot chuno<input type="file" accept="image/*" id="payImg" hidden></label>
        <div id="payPrev" class="proof" style="margin-top:8px"></div></div>

      <button class="btn p block" data-act="paySave">Save payment</button>
    </div>`);
  if(!c)bindPicker('#payQ','#payRes','#payCust')}
function bindPicker(qSel,resSel,outSel,onPick){
  const inp=$(qSel),res=$(resSel);

  return {n:base+(qty!==1?' ×'+L(qty):''),base,pid:p?p.id:'',qty,rate,a:Math.round(qty*rate*100)/100,so:1}})}

function acMatches(q){const k=norm(q);const all=products().filter(p=>p.on!==false);if(!k)return all.slice(0,8);

  return all.map(p=>[sc(p),p]).filter(x=>x[0]<9).sort((a,b)=>a[0]-b[0]||a[1].n.localeCompare(b[1].n)).map(x=>x[1]).slice(0,8)}
function acInput(el){const px=el.dataset.ac,q=el.value;const box=$('#'+px+'Ac');if(!box)return;const list=acMatches(q);const exact=findProd(q);

function acFillRate(px,cid,p,auto){const lr=cid?lastRate(cid,p.id,p.n):null;const r=$('#'+px+'Rate');

function acPick(px,pid){const p=products().find(x=>x.id===pid);if(!p)return;const inp=$('#'+px+'Name');inp.value=p.n;$('#'+px+'Pid').value=p.id;$('#'+px+'Ac').hidden=true;$('#'+px+'MW').hidden=true;acFillRate(px,inp.dataset.cid,p,false);const q=$('#'+px+'Qty');q.focus();q.select()}

    $('#camBtns').innerHTML='<button class="btn o" data-act="camRetake">Dobara lo</button><button class="btn p grow" data-act="camOk">✓ Save karo</button>'},
  camRetake(){openCamera($('#shTitle').textContent,S.camCb)},
  camOk(){const cb=S.camCb,u=S.camUrl;S.camUrl='';closeSheet();if(cb&&u)cb(u)},
  kmSave(d){const b=d.b;const inp=$('#km_'+(norm(b)||'x'));const km=+inp.value;if(inp.value===''||!(km>=0))return toast('KM likho');const rate=+(settings().kmRate??2);const id=kmKey(S.odod,b);
    const doc={date:S.odod,boy:b,km,rate,inc:Math.round(km*rate*100)/100,by:S.me||'',t:Date.now()};S.kms[id]={id,...doc};render();
    queue('km:'+id,()=>S.db.doc('kms/'+id).set(doc)).then(()=>toast(b+': '+L(km)+' km · incentive '+inr(doc.inc)))},
  routeOrder(d){sheetRoute(d.b)},
  rtMv(d){rtMove(+d.i,+d.i+(+d.n))},
  rtSel(d){S.rtSel=S.rtSel===d.id?null:d.id;drawRoute()},
  rtTo(d){rtMove(+d.i,d.to==='top'?0:S.rt.length-1)},
  rtPickStart(d){S.rtPick=d.id;S.rtPickMode=d.m==='before'?'before':'after';S.rtSel=null;drawRoute()},
  rtPickCancel(){const id=S.rtPick;S.rtPick=null;drawRoute(id)},
  rtPickTo(d){const from=S.rt.indexOf(S.rtPick);if(from<0){S.rtPick=null;return drawRoute()}const t=+d.i;let to=S.rtPickMode==='before'?t:t+1;if(from<to)to--;S.rtPick=null;S.rtq='';rtMove(from,to)},
  rtReset(){S.rt=S.rt0.slice();drawRoute()},
  async rtBoy(d){if(d.v===S.rtBoy)return;if(rtDirty()&&!await confirmBox({title:'Order save nahi hua',html:`${esc(S.rtBoy)} ke ${rtDirty()} customer ki jagah badli hai. Bina save kiye ${esc(d.v)} pe jaayein?`,yes:'Haan, jao',no:'Wapas jao',danger:true}))return;sheetRoute(d.v)},
  rtSave(){if(!canWrite())return toast('Aapko write permission nahi hai');if(!isOwner()&&S.rtBoy!==S.me)return toast('Sirf apna order badal sakte ho');
    const b=S.db.batch();let n=0;S.rt.forEach((id,i)=>{const seq=(i+1)*10;if(S.customers[id].seq===seq)return;S.customers[id]={...S.customers[id],seq};b.set(S.db.doc('customers/'+id),{seq},{merge:true});n++});
    if(n)b.commit().then(()=>toast('Order save ho gaya, sabko dikhega')).catch(e=>toast('Save nahi hua: '+(e&&e.message||e)));else toast('Order save');S.rt0=S.rt.slice();closeSheet();render()},
  dSave(d){const c=S.customers[d.id];if(!c)return;const r=rowOf(S.date,d.id);const {q,x}=rowItems(c,r);
    const row=keepPl(makeRow(c,d.s,q,d.s==='k'?[]:x,r&&r.n,S.me),r);const br=readBr('dBr');if(br)Object.assign(row,br);
    writeRows(S.date,{[d.id]:row});closeSheet();toast(d.s==='d'?c.name+': delivered':d.s==='k'?c.name+': skip':'Wapas pending')},
  dCmSave(d){const t=$('#dCm').value.trim();if(!t)return toast('Comment likho');addVar(d.id,{t,till:addDays(todayISO(),1),src:'field'});const bs=$('#dBrS').value,bb=$('#dBrB').value;toast('Comment office tak pahunch gaya');sheetDetail(d.id);$('#dBrS').value=bs;$('#dBrB').value=bb},
  xlsx(d){toast('Excel ban raha hai…');exportXlsx(d.d||addDays(todayISO(),1))}
});

/* ---------- login ---------- */
const LG={role:null,name:'',pin:''};
function renderLogin(){
  const el=$('#login');
  if(S.role&&S.ready&&settings().pins&&!sessionOk()){try{localStorage.removeItem('oritic.login')}catch(_){}S.role=null;S.me='';setTimeout(()=>toast('Login band hua (PIN badla ya naam hata). Dobara login karo'),50)}
  if(S.role){el.hidden=true;return}
  el.hidden=false;
  if(!S.ready){el.innerHTML=`<div class="box"><div class="brand"><div class="mark">O</div><div><b>${esc((settings().company||'Oritic').toUpperCase())}</b><span>Delivery panel</span></div></div><div class="empty">Connect ho raha hai…</div></div>`;return}
  const bl=boys(),sp=(settings().pins||{}).staff||{},stf=(settings().staff||[]).filter(n=>sp[n]);const lk=LG.role?lockLeft(LG.role,LG.name):0;
  el.innerHTML=`<div class="box">
    <div class="brand"><div class="mark">O</div><div><b>${esc((settings().company||'Oritic').toUpperCase())}</b><span>Delivery panel</span></div></div>
    <h3 style="margin-bottom:8px">Kaun ho?</h3>
    <div class="roles">
      <button class="${LG.role==='owner'?'on':''}" data-act="loginRole" data-r="owner">Owner</button>
      ${stf.map(n=>`<button class="${LG.role==='staff'&&LG.name===n?'on':''}" data-act="loginRole" data-r="staff" data-n="${esc(n)}">${esc(n)} <span class="small muted">office</span></button>`).join('')}
      ${bl.map(b=>`<button class="${LG.role==='boy'&&LG.name===b?'on':''}" data-act="loginRole" data-r="boy" data-n="${esc(b)}">${esc(b)}</button>`).join('')}
    </div>
    ${LG.role&&lk?`<div class="empty" style="margin-top:18px;color:var(--danger)">Bahut baar galat PIN. <b>${Math.ceil(lk/60000)} min</b> baad dobara try karo.</div>`:''}
    ${LG.role&&!lk?`<h3 style="margin-top:20px;text-align:center">PIN daalo</h3>
    <div class="pin">${Array.from({length:Math.max(4,LG.pin.length)},(_,i)=>`<i class="${LG.pin.length>i?'f':''}"></i>`).join('')}</div>
    <div class="pad">${['1','2','3','4','5','6','7','8','9'].map(k=>`<button data-act="key" data-k="${k}">${k}</button>`).join('')}<button class="ghost" data-act="key" data-k="del">⌫</button><button data-act="key" data-k="0">0</button><button class="ghost" data-act="loginGo">OK</button></div>`:''}
    <div class="small muted" style="text-align:center;margin-top:18px">${S.online?'':'Offline — '}Phone me app jaise rakhne ke liye: Chrome menu → "Add to Home screen"</div>
  </div>`}
/* ---- login: har insaan ka apna PIN, 5 galat = thodi der band (isi phone pe) ---- */
const pinOf=(role,name)=>{const p=settings().pins||{};return role==='owner'?(p.owner||'1234'):role==='staff'?((p.staff||{})[name]||''):((p.boys||{})[name]||'0000')};
const pinStamp=(role,name)=>{const s=role+'|'+name+'|'+pinOf(role,name);let h=5381;for(let i=0;i<s.length;i++)h=((h*33)^s.charCodeAt(i))>>>0;return h.toString(36)};
const lockGet=()=>{try{return JSON.parse(localStorage.getItem('oritic.lock')||'{}')||{}}catch(_){return {}}};
const lockSet=o=>{try{localStorage.setItem('oritic.lock',JSON.stringify(o))}catch(_){}};
function lockLeft(role,name){const x=lockGet()[role+':'+name];return x&&x.until>Date.now()?x.until-Date.now():0}
function lockFail(role,name){const L0=lockGet(),k=role+':'+name,x=L0[k]||{n:0,until:0};x.n++;if(x.n>=5&&x.n%5===0)x.until=Date.now()+Math.min(60,5*Math.pow(2,x.n/5-1))*60000;L0[k]=x;lockSet(L0);return x}
function tryLogin(){
  if(lockLeft(LG.role,LG.name)){LG.pin='';renderLogin();return}
  const expected=pinOf(LG.role,LG.name);if(!expected){LG.pin='';renderLogin();return toast('Iska PIN set nahi hai. Owner se bolo')}
  if(LG.pin===expected){const L0=lockGet();delete L0[LG.role+':'+LG.name];lockSet(L0);
    S.role=LG.role==='staff'?'owner':LG.role;S.me=LG.role==='owner'?'Owner':LG.name;
    try{localStorage.setItem('oritic.login',JSON.stringify({role:S.role,me:S.me,lr:LG.role,st:pinStamp(LG.role,S.me)}))}catch(_){}
    S.route=isOwner()?'sheet':'today';LG.pin='';render();toast('Namaste, '+S.me)}
  else if(LG.pin.length>=expected.length){const x=lockFail(LG.role,LG.name);LG.pin='';renderLogin();toast(x.until>Date.now()?'Bahut baar galat PIN. Thodi der baad try karo':'PIN galat hai'+(x.n%5?' · '+(5-x.n%5)+' try baaki':''))}}
/* purana login: naam hata ya PIN badla to us phone se logout */
function sessionOk(){if(!S.role)return true;let l=null;try{l=JSON.parse(localStorage.getItem('oritic.login')||'null')}catch(_){}if(!l)return true;
  const lr=l.lr||(S.role==='owner'?(S.me==='Owner'?'owner':'staff'):'boy');
  if(lr==='boy'&&!boys().includes(S.me))return false;
  if(lr==='staff'&&!((settings().staff||[]).includes(S.me)&&pinOf('staff',S.me)))return false;
  if(l.st&&l.st!==pinStamp(lr,S.me))return false;return true}
A.loginGo=()=>{if(lockLeft(LG.role,LG.name))return renderLogin();if(LG.pin.length<4)return toast('4 digit PIN daalo');tryLogin()};
function setupHtml(){return `<div class="setup"><div class="brand"><div class="mark">O</div><div><b>ORITIC</b><span>Delivery panel</span></div></div>
  <div class="card"><h2>Setup baaki hai</h2><p class="muted">Ye app abhi kisi database se juda nahi hai. <code>firebase-config.js</code> file me apne Firebase project ka config paste karo, phir ye page dobara kholo.</p>
  <ol><li>console.firebase.google.com → project banao</li><li>Build → Firestore Database → Create (asia-south1)</li><li>Build → Authentication → Sign-in method → Anonymous → Enable</li><li>Project settings → "Add app" → Web → config copy karo</li><li>Config ko <code>firebase-config.js</code> me paste karo</li></ol></div></div>`}

/* ---------- boot ---------- */
/* boot DOMContentLoaded pe, taaki js/bulk.js ke naye pages (aur #hash) pehle se registered hon */
window.addEventListener('DOMContentLoaded',async()=>{
  try{const b=localStorage.getItem('oritic.boy');if(b)S.boy=b}catch(_){}
  try{const l=JSON.parse(localStorage.getItem('oritic.login')||'null');if(l&&l.role){S.role=l.role;S.me=l.me}}catch(_){}
  const hash=(location.hash||'').slice(1);if(ROUTES.some(r=>r.id===hash))S.route=hash;
  window.addEventListener('online',()=>{S.online=true;render()});window.addEventListener('offline',()=>{S.online=false;render()});S.online=navigator.onLine!==false;
  if('serviceWorker' in navigator){navigator.serviceWorker.register('sw.js').catch(()=>{})}
  const cfg=window.FIREBASE_CONFIG;
  if(!cfg||!cfg.apiKey||/PASTE|XXXX/.test(cfg.apiKey)||!window.firebase){S.setup=true;render();return}
  render();
  let db;
  try{firebase.initializeApp(cfg);db=firebase.firestore();try{await db.enablePersistence({synchronizeTabs:true})}catch(_){}
    await firebase.auth().signInAnonymously()}catch(e){console.error(e);S.ready=true;S.offline=true;render();return}
  S.db=db;
  let first=0;const ok=()=>{if(++first>=2&&!S.ready){S.ready=true;render()}else rerender()};
  const onErr=e=>{console.error(e);toast('Data error: '+(e&&e.code||''));if(!S.ready){S.ready=true;S.offline=true;render()}};
  db.collection('customers').onSnapshot(s=>{const m={};s.docs.forEach(d=>{m[d.id]={id:d.id,...JSON.parse(JSON.stringify(d.data()))}});S.customers=m;ok()},onErr);
  db.collection('days').onSnapshot(s=>{const m={};s.docs.forEach(d=>{m[d.id]=JSON.parse(JSON.stringify(d.data()));m[d.id].rows=m[d.id].rows||{}});S.days=m;ok()},onErr);
  db.collection('payments').onSnapshot(s=>{const m={};s.docs.forEach(d=>{m[d.id]={id:d.id,...d.data()}});S.payments=m;rerender()},onErr);
  db.doc('settings/main').onSnapshot(s=>{S.settings=s.exists?JSON.parse(JSON.stringify(s.data())):null;rerender()},onErr);
  db.collection('purchases').onSnapshot(s=>{const m={};s.docs.forEach(d=>{m[d.id]={id:d.id,...d.data()}});S.purchases=m;rerender()},e=>console.error(e));
  db.collection('kms').onSnapshot(s=>{const m={};s.docs.forEach(d=>{m[d.id]={id:d.id,...d.data()}});S.kms=m;rerender()},e=>console.error(e));
  db.collection('adjust').onSnapshot(s=>{const m={};s.docs.forEach(d=>{m[d.id]={id:d.id,...d.data()}});S.adjust=m;rerender()},e=>console.error(e));
  db.collection('cashbook').onSnapshot(s=>{const m={};s.docs.forEach(d=>{m[d.id]={id:d.id,...d.data()}});S.cash=m;rerender()},e=>console.error(e));
  setInterval(autoExportTick,60000);
  setTimeout(()=>{if(!S.ready){S.ready=true;render()}},10000);
});
